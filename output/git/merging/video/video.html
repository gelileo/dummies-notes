<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
:root{color-scheme:light dark}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
     background:#0f1115;color:#e8e8e8;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#stage{position:relative;width:min(96vw,1100px);aspect-ratio:16/9;background:#15181f;
       border-radius:10px;overflow:hidden;margin-top:1.2rem}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
       justify-content:center;opacity:0;transition:opacity .5s ease;padding:2.2rem 2.2rem 3.4rem;box-sizing:border-box}
.slide.show{opacity:1} .slide.cut{transition:none}
.slide svg{max-width:100%;max-height:78%;height:auto}
.card{font-size:2.4rem;text-align:center;line-height:1.3}
#cap{position:absolute;bottom:1rem;left:0;right:0;text-align:center;font-size:1.05rem;color:#cfd2d8;padding:0 2rem;min-height:1.4em}
[data-reveal]{opacity:0;transition:opacity .55s ease,transform .55s ease}
[data-reveal]:not([data-anim="draw"]){transform:translateY(10px)}
[data-reveal][data-anim="fade"]{transform:none}
[data-reveal].on{opacity:1;transform:none}
[data-reveal].dim{opacity:.32}
#bar{width:min(96vw,1100px);display:flex;gap:.8rem;align-items:center;margin:.8rem 0}
#prog{flex:1;height:5px;background:#2a2d36;border-radius:3px;overflow:hidden}
#prog>div{height:100%;width:0;background:#5DCAA5}
button{font:inherit;background:#23262e;color:#e8e8e8;border:1px solid #3a3d46;border-radius:6px;padding:.35rem .8rem;cursor:pointer}
label{font-size:.9rem;color:#aab;display:flex;gap:.35rem;align-items:center}
</style></head><body>
<div id="stage"><div class="slide"><div class="card">Merging: joining two lines back together</div></div>
<div class="slide"><svg class="cd-svg" xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 260" role="img" font-family="sans-serif">
  <title>Merging: joining two lines back together</title>
  <desc>Two lines of commit dots that split from a shared commit converge into one brand-new commit, which is given a parent link back to the tip of each line so both histories lead into it.</desc>
  <defs>
    <!-- This <style> block is the inlined copy of assets/_style.css. It is intentionally duplicated so each figure renders standalone (self-contained, light/dark). Keep the two in sync; _style.css is the source of truth. -->
    <style>text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,"Helvetica Neue",Arial,sans-serif;}
text.t{font-size:14px;font-weight:400;fill:#1c1c1a;}
text.ts{font-size:12px;font-weight:400;fill:#6b6a64;}
text.th{font-size:14px;font-weight:500;fill:#111110;}
rect.box,.box>rect{fill:#F1EFE8;stroke:#D3D1C7;}
.arr{stroke:#6b6a64;stroke-width:1.5;fill:none;stroke-linecap:round;}
.leader{stroke:#9c9a92;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon{fill:#EEEDFE;stroke:#534AB7;}
.c-purple .th,.c-purple .t{fill:#3C3489;} .c-purple .ts{fill:#534AB7;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon{fill:#E1F5EE;stroke:#0F6E56;}
.c-teal .th,.c-teal .t{fill:#085041;} .c-teal .ts{fill:#0F6E56;}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon{fill:#FAECE7;stroke:#993C1D;}
.c-coral .th,.c-coral .t{fill:#712B13;} .c-coral .ts{fill:#993C1D;}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon{fill:#FBEAF0;stroke:#993556;}
.c-pink .th,.c-pink .t{fill:#72243E;} .c-pink .ts{fill:#993556;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A;}
.c-gray .th,.c-gray .t{fill:#444441;} .c-gray .ts{fill:#5F5E5A;}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon{fill:#E6F1FB;stroke:#185FA5;}
.c-blue .th,.c-blue .t{fill:#0C447C;} .c-blue .ts{fill:#185FA5;}
.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon{fill:#EAF3DE;stroke:#3B6D11;}
.c-green .th,.c-green .t{fill:#27500A;} .c-green .ts{fill:#3B6D11;}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon{fill:#FAEEDA;stroke:#854F0B;}
.c-amber .th,.c-amber .t{fill:#633806;} .c-amber .ts{fill:#854F0B;}
.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon{fill:#FCEBEB;stroke:#A32D2D;}
.c-red .th,.c-red .t{fill:#791F1F;} .c-red .ts{fill:#A32D2D;}
@media (prefers-color-scheme:dark){
text.t{fill:#d6d4ca;} text.ts{fill:#b6b4aa;} text.th{fill:#f2f0e9;}
rect.box,.box>rect{fill:#2C2C2A;stroke:#5F5E5A;}
.arr{stroke:#b0aea4;} .leader{stroke:#8a8980;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon{fill:#3C3489;stroke:#AFA9EC;}
.c-purple .th,.c-purple .t{fill:#CECBF6;} .c-purple .ts{fill:#AFA9EC;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon{fill:#085041;stroke:#5DCAA5;}
.c-teal .th,.c-teal .t{fill:#9FE1CB;} .c-teal .ts{fill:#5DCAA5;}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon{fill:#712B13;stroke:#F0997B;}
.c-coral .th,.c-coral .t{fill:#F5C4B3;} .c-coral .ts{fill:#F0997B;}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon{fill:#72243E;stroke:#ED93B1;}
.c-pink .th,.c-pink .t{fill:#F4C0D1;} .c-pink .ts{fill:#ED93B1;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon{fill:#444441;stroke:#B4B2A9;}
.c-gray .th,.c-gray .t{fill:#D3D1C7;} .c-gray .ts{fill:#B4B2A9;}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon{fill:#0C447C;stroke:#85B7EB;}
.c-blue .th,.c-blue .t{fill:#B5D4F4;} .c-blue .ts{fill:#85B7EB;}
.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon{fill:#27500A;stroke:#97C459;}
.c-green .th,.c-green .t{fill:#C0DD97;} .c-green .ts{fill:#97C459;}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon{fill:#633806;stroke:#EF9F27;}
.c-amber .th,.c-amber .t{fill:#FAC775;} .c-amber .ts{fill:#EF9F27;}
.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon{fill:#791F1F;stroke:#F09595;}
.c-red .th,.c-red .t{fill:#F7C1C1;} .c-red .ts{fill:#F09595;}
}
.arrow-head{fill:#6b6a64;}
@media (prefers-color-scheme:dark){.arrow-head{fill:#b0aea4;}}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Reveal 1: the setup - two lines that split from shared commit c9. Main (blue) runs along the bottom b2->c9->d4; feature (teal) leaves c9 diagonally up to e5. -->
  <g data-reveal="1" data-anim="rise">
    <text x="20" y="199" class="ts">main</text>
    <text x="355" y="56" class="ts" text-anchor="middle">feature</text>
    <path class="arr" d="M117,195 L203,195" marker-end="url(#arrow)"/>
    <path class="arr" d="M247,195 L333,195" marker-end="url(#arrow)"/>
    <path class="arr" d="M242,182 L338,108" marker-end="url(#arrow)"/>
    <g class="c-blue">
      <circle cx="95" cy="195" r="22" stroke-width="0.5"/>
      <text x="95" y="195" class="th" text-anchor="middle" dominant-baseline="central">b2</text>
    </g>
    <g class="c-blue">
      <circle cx="225" cy="195" r="22" stroke-width="0.5"/>
      <text x="225" y="195" class="th" text-anchor="middle" dominant-baseline="central">c9</text>
    </g>
    <g class="c-blue">
      <circle cx="355" cy="195" r="22" stroke-width="0.5"/>
      <text x="355" y="195" class="th" text-anchor="middle" dominant-baseline="central">d4</text>
    </g>
    <g class="c-teal">
      <circle cx="355" cy="95" r="22" stroke-width="0.5"/>
      <text x="355" y="95" class="th" text-anchor="middle" dominant-baseline="central">e5</text>
    </g>
  </g>

  <!-- Reveal 2: the brand-new merge commit g7 (purple) appears between the two lines -->
  <g data-reveal="2" data-anim="rise">
    <text x="520" y="190" class="ts" text-anchor="middle">merge</text>
    <g class="c-purple">
      <circle cx="520" cy="145" r="22" stroke-width="0.5"/>
      <text x="520" y="145" class="th" text-anchor="middle" dominant-baseline="central">g7</text>
    </g>
  </g>

  <!-- Reveal 3: first parent link - from the tip of main (d4) into g7 -->
  <g data-reveal="3" data-anim="draw">
    <path class="arr" d="M376,189 L499,151" marker-end="url(#arrow)"/>
  </g>

  <!-- Reveal 4: second parent link - from the tip of feature (e5) into g7; now g7 has two parents -->
  <g data-reveal="4" data-anim="draw">
    <path class="arr" d="M376,101 L499,139" marker-end="url(#arrow)"/>
  </g>
</svg>
</div><div id="cap"></div></div>
<div id="bar">
  <button id="play">⏸ Pause</button>
  <button id="prev">←</button><button id="next">→</button>
  <div id="prog"><div></div></div>
  <span id="count"></span>
  <label><input type="checkbox" id="tts"> 🔊 narrate</label>
  <label><input type="checkbox" id="dim" checked> dim past</label>
</div>
<script>
var M=window.__MANIFEST__={"topic": "merging", "title": "Merging: joining two lines back together", "definition": "Merging joins two branch lines back into one. Git makes a new dot with two parents, one from each line, and combines both sets of changes into it. The two lines become one again, and the full history of both is kept.", "stage": {"width": 1280, "height": 720}, "reading_rate_wpm": 150, "slides": [{"kind": "title", "concept_slug": null, "caption": "Merging: joining two lines back together", "narration": "Merging: joining two lines back together", "duration_s": 2.5, "transition": "cut", "reveal_to": null, "container": 0}, {"kind": "frame", "concept_slug": "merging", "caption": "Two lines that split from a shared commit", "narration": "Here are two lines of history - blue main and teal feature - that split from the shared commit c9 and each added their own commits.", "duration_s": 10.4, "transition": "cut", "reveal_to": 1, "container": 1}, {"kind": "frame", "concept_slug": "merging", "caption": "Git makes one new commit to join them", "narration": "To join them back together, Git creates one brand-new commit, the purple dot g7, sitting between the two lines.", "duration_s": 7.6, "transition": "reveal", "reveal_to": 2, "container": 1}, {"kind": "frame", "concept_slug": "merging", "caption": "Its first parent is the tip of main", "narration": "Give it a link back to d4, the tip of the main line: that is its first parent.", "duration_s": 7.2, "transition": "reveal", "reveal_to": 3, "container": 1}, {"kind": "frame", "concept_slug": "merging", "caption": "Its second parent is the tip of feature", "narration": "Give it a second link back to e5, the tip of the feature line: now g7 has two parents, both histories lead into it, and the two lines are one again.", "duration_s": 12.4, "transition": "reveal", "reveal_to": 4, "container": 1}]};
var conts=[].slice.call(document.querySelectorAll('#stage > .slide'));
var cap=document.getElementById('cap'),count=document.getElementById('count');
var progEl=document.querySelector('#prog>div');
var tts=document.getElementById('tts'),dim=document.getElementById('dim');
var i=0,playing=true,timer=null,progRAF=null,start=0;
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.onend=function(){if(playing&&tts.checked)next();};speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function drawLines(g){
  var lines=g.tagName.toLowerCase()==='line'?[g]:[].slice.call(g.querySelectorAll('line'));
  lines.forEach(function(ln){
    // capture the TRUE target once (initial attributes are the full endpoint),
    // so re-entry never reads a mid-animation value
    if(!ln.dataset.tx2){ln.dataset.tx2=ln.getAttribute('x2');ln.dataset.ty2=ln.getAttribute('y2');}
    var x1=+ln.getAttribute('x1'),y1=+ln.getAttribute('y1'),x2=+ln.dataset.tx2,y2=+ln.dataset.ty2;
    var gen=(ln._gen=(ln._gen||0)+1),t0=null,D=650;   // generation token cancels a stale RAF
    ln.setAttribute('x2',x1); ln.setAttribute('y2',y1);
    function fr(ts){if(ln._gen!==gen)return; if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/D),e=1-Math.pow(1-p,3);
      ln.setAttribute('x2',(x1+(x2-x1)*e).toFixed(1));ln.setAttribute('y2',(y1+(y2-y1)*e).toFixed(1));
      if(p<1)requestAnimationFrame(fr);}
    requestAnimationFrame(fr);
  });
}
function reveal(cont,level){
  [].slice.call(cont.querySelectorAll('[data-reveal]')).forEach(function(g){
    var k=+g.getAttribute('data-reveal'), shown=(level===null||k<=level);
    if(shown){
      if(!g.classList.contains('on')){g.classList.add('on'); if(g.getAttribute('data-anim')==='draw')drawLines(g);}
      g.classList.toggle('dim', dim.checked && level!==null && k<level);
    } else { g.classList.remove('on','dim'); }
  });
}
function show(n){
  i=(n+M.slides.length)%M.slides.length; var s=M.slides[i];
  conts.forEach(function(c,ci){c.classList.toggle('show',ci===s.container);});
  var cont=conts[s.container];
  if(cont)cont.classList.toggle('cut',s.transition!=='crossfade'&&s.transition!=='reveal');
  if(cont && cont.querySelector('[data-reveal]')) reveal(cont, s.reveal_to);
  cap.textContent = s.kind==='frame' ? (s.caption||'') : '';
  count.textContent=(i+1)+' / '+M.slides.length;
  clearTimeout(timer);start=performance.now();var dur=s.duration_s*1000;
  if(tts.checked)speak(s.narration); else if(playing)timer=setTimeout(next,dur);
  prog(dur);
}
function prog(dur){cancelAnimationFrame(progRAF);(function step(){var p=Math.min(1,(performance.now()-start)/dur);progEl.style.width=(p*100)+'%';if(p<1&&playing)progRAF=requestAnimationFrame(step);})();}
function next(){show(i+1);}function prev(){show(i-1);}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'⏸ Pause':'▶ Play';if(playing)show(i);else{clearTimeout(timer);speechSynthesis.cancel();}};
dim.onchange=function(){var s=M.slides[i],c=conts[s.container];if(c&&c.querySelector('[data-reveal]'))reveal(c,s.reveal_to);};
show(0);
</script></body></html>
