<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#ffffff"/>
<text x="640" y="44" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#444">project version snapshot</text>
<svg x="40" y="70" width="1200" height="560" preserveAspectRatio="xMidYMid meet" class="cd-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" role="img" font-family="sans-serif">
  <title>A version is a saved snapshot of your whole project</title>
  <desc>A live project folder is photographed on a timeline; each photo is one version, a complete copy of every file at that moment, and any version can be restored.</desc>
  <defs>
    <!-- This <style> block is the inlined copy of assets/_style.css. It is intentionally duplicated so each figure renders standalone (self-contained, light/dark). Keep the two in sync; _style.css is the source of truth. -->
    <style>text{font-family:-apple-system,"Segoe UI",Roboto,system-ui,"Helvetica Neue",Arial,sans-serif;}
text.t{font-size:14px;font-weight:400;fill:#1c1c1a;}
text.ts{font-size:12px;font-weight:400;fill:#6b6a64;}
text.th{font-size:14px;font-weight:500;fill:#111110;}
rect.box,.box>rect{fill:#F1EFE8;stroke:#D3D1C7;}
.arr{stroke:#6b6a64;stroke-width:1.5;fill:none;stroke-linecap:round;}
.leader{stroke:#9c9a92;stroke-width:0.5;stroke-dasharray:3 3;fill:none;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon{fill:#EEEDFE;stroke:#534AB7;}
.c-purple .th,.c-purple .t{fill:#3C3489;} .c-purple .ts{fill:#534AB7;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon{fill:#E1F5EE;stroke:#0F6E56;}
.c-teal .th,.c-teal .t{fill:#085041;} .c-teal .ts{fill:#0F6E56;}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon{fill:#FAECE7;stroke:#993C1D;}
.c-coral .th,.c-coral .t{fill:#712B13;} .c-coral .ts{fill:#993C1D;}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon{fill:#FBEAF0;stroke:#993556;}
.c-pink .th,.c-pink .t{fill:#72243E;} .c-pink .ts{fill:#993556;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A;}
.c-gray .th,.c-gray .t{fill:#444441;} .c-gray .ts{fill:#5F5E5A;}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon{fill:#E6F1FB;stroke:#185FA5;}
.c-blue .th,.c-blue .t{fill:#0C447C;} .c-blue .ts{fill:#185FA5;}
.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon{fill:#EAF3DE;stroke:#3B6D11;}
.c-green .th,.c-green .t{fill:#27500A;} .c-green .ts{fill:#3B6D11;}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon{fill:#FAEEDA;stroke:#854F0B;}
.c-amber .th,.c-amber .t{fill:#633806;} .c-amber .ts{fill:#854F0B;}
.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon{fill:#FCEBEB;stroke:#A32D2D;}
.c-red .th,.c-red .t{fill:#791F1F;} .c-red .ts{fill:#A32D2D;}
@media (prefers-color-scheme:dark){
text.t{fill:#d6d4ca;} text.ts{fill:#b6b4aa;} text.th{fill:#f2f0e9;}
rect.box,.box>rect{fill:#2C2C2A;stroke:#5F5E5A;}
.arr{stroke:#b0aea4;} .leader{stroke:#8a8980;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon{fill:#3C3489;stroke:#AFA9EC;}
.c-purple .th,.c-purple .t{fill:#CECBF6;} .c-purple .ts{fill:#AFA9EC;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon{fill:#085041;stroke:#5DCAA5;}
.c-teal .th,.c-teal .t{fill:#9FE1CB;} .c-teal .ts{fill:#5DCAA5;}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon{fill:#712B13;stroke:#F0997B;}
.c-coral .th,.c-coral .t{fill:#F5C4B3;} .c-coral .ts{fill:#F0997B;}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon{fill:#72243E;stroke:#ED93B1;}
.c-pink .th,.c-pink .t{fill:#F4C0D1;} .c-pink .ts{fill:#ED93B1;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon{fill:#444441;stroke:#B4B2A9;}
.c-gray .th,.c-gray .t{fill:#D3D1C7;} .c-gray .ts{fill:#B4B2A9;}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon{fill:#0C447C;stroke:#85B7EB;}
.c-blue .th,.c-blue .t{fill:#B5D4F4;} .c-blue .ts{fill:#85B7EB;}
.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon{fill:#27500A;stroke:#97C459;}
.c-green .th,.c-green .t{fill:#C0DD97;} .c-green .ts{fill:#97C459;}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon{fill:#633806;stroke:#EF9F27;}
.c-amber .th,.c-amber .t{fill:#FAC775;} .c-amber .ts{fill:#EF9F27;}
.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon{fill:#791F1F;stroke:#F09595;}
.c-red .th,.c-red .t{fill:#F7C1C1;} .c-red .ts{fill:#F09595;}
}
.arrow-head{fill:#6b6a64;}
@media (prefers-color-scheme:dark){.arrow-head{fill:#b0aea4;}}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- backdrop: heading + timeline -->
  <text class="th" x="40" y="40">one version = one photo of the whole folder</text>
  <line class="arr" x1="320" y1="285" x2="655" y2="285" marker-end="url(#arrow)"/>
  <text class="ts" x="620" y="302" text-anchor="middle">time</text>

  <!-- reveal 1: the live project folder -->
  <g data-reveal="1" data-anim="rise">
    <g class="box"><rect x="40" y="70" width="210" height="180" rx="8" stroke-width="0.5"/></g>
    <text class="ts" x="54" y="90">project folder</text>
    <g class="box"><rect x="54" y="100" width="182" height="34" rx="3" stroke-width="0.5"/></g>
    <text class="th" x="64" y="117" dominant-baseline="central">index.html</text>
    <g class="box"><rect x="54" y="142" width="182" height="34" rx="3" stroke-width="0.5"/></g>
    <text class="th" x="64" y="159" dominant-baseline="central">styles.css</text>
    <g class="box"><rect x="54" y="184" width="182" height="34" rx="3" stroke-width="0.5"/></g>
    <text class="th" x="64" y="201" dominant-baseline="central">app.js</text>
  </g>

  <!-- reveal 2: photograph the folder -> version 1 -->
  <g style="visibility:hidden" data-reveal="2" data-anim="rise">
    <line class="arr" x1="252" y1="112" x2="316" y2="112" marker-end="url(#arrow)"/>
    <text class="ts" x="284" y="104" text-anchor="middle">snapshot</text>
    <g class="c-purple"><rect x="320" y="70" width="150" height="170" rx="6" stroke-width="0.5"/></g>
    <text class="th" x="395" y="90" text-anchor="middle" dominant-baseline="central">version 1</text>
    <g class="box"><rect x="336" y="104" width="118" height="26" rx="2" stroke-width="0.5"/></g>
    <text class="ts" x="395" y="117" text-anchor="middle" dominant-baseline="central">index.html</text>
    <g class="box"><rect x="336" y="138" width="118" height="26" rx="2" stroke-width="0.5"/></g>
    <text class="ts" x="395" y="151" text-anchor="middle" dominant-baseline="central">styles.css</text>
    <g class="box"><rect x="336" y="172" width="118" height="26" rx="2" stroke-width="0.5"/></g>
    <text class="ts" x="395" y="185" text-anchor="middle" dominant-baseline="central">app.js</text>
    <line class="leader" x1="395" y1="240" x2="395" y2="285"/>
    <text class="ts" x="395" y="302" text-anchor="middle">9:00</text>
  </g>

  <!-- reveal 3: a file gets edited in the live folder -->
  <g style="visibility:hidden" data-reveal="3" data-anim="rise">
    <g class="c-amber"><rect x="152" y="148" width="80" height="22" rx="4" stroke-width="0.5"/></g>
    <text class="ts" x="192" y="159" text-anchor="middle" dominant-baseline="central">edited</text>
  </g>

  <!-- reveal 4: snap again -> version 2 with the change baked in -->
  <g style="visibility:hidden" data-reveal="4" data-anim="rise">
    <g class="c-purple"><rect x="500" y="70" width="150" height="170" rx="6" stroke-width="0.5"/></g>
    <text class="th" x="575" y="90" text-anchor="middle" dominant-baseline="central">version 2</text>
    <g class="box"><rect x="516" y="104" width="118" height="26" rx="2" stroke-width="0.5"/></g>
    <text class="ts" x="575" y="117" text-anchor="middle" dominant-baseline="central">index.html</text>
    <g class="c-amber"><rect x="516" y="138" width="118" height="26" rx="2" stroke-width="0.5"/></g>
    <text class="ts" x="575" y="151" text-anchor="middle" dominant-baseline="central">styles.css</text>
    <g class="box"><rect x="516" y="172" width="118" height="26" rx="2" stroke-width="0.5"/></g>
    <text class="ts" x="575" y="185" text-anchor="middle" dominant-baseline="central">app.js</text>
    <line class="leader" x1="575" y1="240" x2="575" y2="285"/>
    <text class="ts" x="575" y="302" text-anchor="middle">9:20</text>
  </g>

  <!-- reveal 5: restore a version, bringing the whole folder back -->
  <g style="visibility:hidden" data-reveal="5" data-anim="draw">
    <line class="arr" x1="316" y1="172" x2="252" y2="172" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
    <text class="ts" x="284" y="164" text-anchor="middle">restore</text>
  </g>
</svg>

<text x="640" y="686" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#222">Your project folder and its files.</text>
</svg>