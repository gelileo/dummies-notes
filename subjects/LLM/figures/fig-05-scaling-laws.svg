<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Log-log plot of loss versus training compute. Points for models from 10^17 to 10^25 FLOPs fall on a straight descending line; a dashed extension predicts the next model's loss before it is trained." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Scaling laws</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<line x1="70" y1="250" x2="600" y2="250" stroke="currentColor" opacity=".5"/><line x1="70" y1="250" x2="70" y2="30" stroke="currentColor" opacity=".5"/>
<g opacity=".7" font-variant-numeric="tabular-nums">
<text x="70" y="270" text-anchor="middle">10¹⁷</text><text x="176" y="270" text-anchor="middle">10¹⁹</text><text x="282" y="270" text-anchor="middle">10²¹</text><text x="388" y="270" text-anchor="middle">10²³</text><text x="494" y="270" text-anchor="middle">10²⁵</text>
<text x="600" y="270" text-anchor="end">FLOPs</text>
<text x="62" y="250" text-anchor="end">2.0</text><text x="62" y="176" text-anchor="end">3.0</text><text x="62" y="103" text-anchor="end">4.5</text><text x="62" y="40" text-anchor="end">7.0</text>
</g>
<text x="24" y="140" transform="rotate(-90 24 140)" text-anchor="middle" opacity=".7">test loss (log scale)</text>
<text x="335" y="292" text-anchor="middle" opacity=".7">training compute (log scale)</text>
<g stroke="currentColor" opacity=".12"><line x1="70" y1="176" x2="600" y2="176"/><line x1="70" y1="103" x2="600" y2="103"/><line x1="176" y1="30" x2="176" y2="250"/><line x1="282" y1="30" x2="282" y2="250"/><line x1="388" y1="30" x2="388" y2="250"/><line x1="494" y1="30" x2="494" y2="250"/></g>
<line x1="80" y1="60" x2="470" y2="212" class="as" stroke-width="2.5"/>
<line x1="470" y1="212" x2="590" y2="259" class="as" stroke-width="2.5" stroke-dasharray="6 5" opacity=".8"/>
<g fill="currentColor">
<circle cx="90" cy="66" r="4"/><circle cx="130" cy="79" r="4"/><circle cx="165" cy="95" r="4"/><circle cx="205" cy="108" r="4"/><circle cx="240" cy="124" r="4"/><circle cx="285" cy="139" r="4"/><circle cx="330" cy="158" r="4"/><circle cx="380" cy="178" r="4"/><circle cx="425" cy="193" r="4"/><circle cx="460" cy="209" r="4"/>
</g>
<circle cx="540" cy="239" r="6" fill="none" class="as" stroke-width="2"/>
<text x="540" y="222" text-anchor="middle" class="af" font-weight="700">next model</text>
<text x="540" y="209" text-anchor="middle" class="af" font-size="11">predicted before training</text>
<text x="150" y="150" font-style="italic" opacity=".75">straight on log-log axes</text>
<text x="150" y="166" font-style="italic" opacity=".75">= power law: loss ∝ compute^−0.05</text>
<text x="380" y="70" opacity=".75">each point: a model trained</text><text x="380" y="86" opacity=".75">to convergence at that budget</text>
</g></svg>
