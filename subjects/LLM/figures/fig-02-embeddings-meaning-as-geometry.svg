<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="A two-dimensional projection of an embedding space: king, queen, man and woman form a parallelogram, with the man-to-woman arrow parallel to the king-to-queen arrow; a cluster of animal words sits far away." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Embeddings: meaning as geometry</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" class="af"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12.5" fill="currentColor">
<line x1="40" y1="260" x2="530" y2="260" stroke="currentColor" opacity=".35"/><line x1="40" y1="260" x2="40" y2="20" stroke="currentColor" opacity=".35"/>
<text x="530" y="278" text-anchor="end" opacity=".6">dimension 1 (of ~4096)</text>
<text x="20" y="20" transform="rotate(-90 20 20)" text-anchor="end" opacity=".6">dimension 2</text>
<line x1="120" y1="200" x2="200" y2="120" class="as" stroke-width="2" marker-end="url(#a2)"/>
<line x1="300" y1="190" x2="380" y2="110" class="as" stroke-width="2" marker-end="url(#a2)"/>
<line x1="120" y1="200" x2="300" y2="190" stroke="currentColor" opacity=".3" stroke-dasharray="3 4"/>
<line x1="200" y1="120" x2="380" y2="110" stroke="currentColor" opacity=".3" stroke-dasharray="3 4"/>
<circle cx="120" cy="200" r="5" fill="currentColor"/><text x="120" y="222" text-anchor="middle">man</text>
<circle cx="200" cy="120" r="5" fill="currentColor"/><text x="200" y="108" text-anchor="middle">woman</text>
<circle cx="300" cy="190" r="5" fill="currentColor"/><text x="300" y="212" text-anchor="middle">king</text>
<circle cx="380" cy="110" r="5" fill="currentColor"/><text x="380" y="98" text-anchor="middle">queen</text>
<text x="240" y="150" text-anchor="middle" class="af" font-style="italic">same direction ≈ “gender”</text>
<circle cx="470" cy="215" r="4" fill="currentColor" opacity=".7"/><text x="482" y="212">cat</text>
<circle cx="490" cy="238" r="4" fill="currentColor" opacity=".7"/><text x="502" y="242">kitten</text>
<circle cx="455" cy="240" r="4" fill="currentColor" opacity=".7"/><text x="410" y="244">dog</text>
<circle cx="470" cy="225" r="42" fill="none" stroke="currentColor" opacity=".3" stroke-dasharray="3 3"/>
<text x="470" y="292" text-anchor="middle" opacity=".7" font-style="italic">nearby = similar meaning</text>
</g></svg>
