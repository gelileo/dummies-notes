<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-label="Retrieval-augmented generation: a question is embedded and matched against a vector index of document chunks; the top three chunks are inserted into the prompt alongside the question; the model answers with citations." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Long context, retrieval and memory</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<rect x="12" y="80" width="110" height="44" rx="3" fill="none" stroke="currentColor"/><text x="67" y="98" text-anchor="middle" font-weight="700">question</text><text x="67" y="114" text-anchor="middle" font-size="10.5" opacity=".75">“refund policy for…”</text>
<line x1="122" y1="102" x2="160" y2="102" stroke="currentColor" marker-end="url(#a11)"/><text x="141" y="94" text-anchor="middle" font-size="10.5" opacity=".75">embed</text>
<rect x="162" y="36" width="150" height="132" rx="3" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
<text x="237" y="54" text-anchor="middle" font-weight="700">vector index</text>
<text x="237" y="68" text-anchor="middle" font-size="10.5" opacity=".75">10⁶ document chunks</text>
<g fill="currentColor" opacity=".35"><circle cx="185" cy="90" r="3"/><circle cx="205" cy="120" r="3"/><circle cx="270" cy="150" r="3"/><circle cx="290" cy="85" r="3"/><circle cx="220" cy="150" r="3"/><circle cx="180" cy="140" r="3"/><circle cx="295" cy="120" r="3"/><circle cx="255" cy="80" r="3"/></g>
<circle cx="240" cy="112" r="6" fill="none" class="as" stroke-width="2"/>
<g class="af"><circle cx="232" cy="98" r="3.5"/><circle cx="252" cy="120" r="3.5"/><circle cx="228" cy="124" r="3.5"/></g>
<circle cx="240" cy="112" r="22" fill="none" class="as" opacity=".6" stroke-dasharray="3 3"/>
<text x="237" y="184" text-anchor="middle" font-size="10.5" class="af">nearest 3 chunks</text>
<line x1="312" y1="102" x2="350" y2="102" class="as" stroke-width="2" marker-end="url(#a11)"/>
<rect x="352" y="40" width="160" height="124" rx="3" fill="none" stroke="currentColor"/>
<text x="432" y="58" text-anchor="middle" font-weight="700">prompt</text>
<rect x="362" y="68" width="140" height="18" class="af" opacity=".25"/><text x="432" y="81" text-anchor="middle" font-size="10.5">chunk: “Refunds within 30…”</text>
<rect x="362" y="90" width="140" height="18" class="af" opacity=".25"/><text x="432" y="103" text-anchor="middle" font-size="10.5">chunk: “Exceptions for…”</text>
<rect x="362" y="112" width="140" height="18" class="af" opacity=".25"/><text x="432" y="125" text-anchor="middle" font-size="10.5">chunk: “Process via portal”</text>
<rect x="362" y="134" width="140" height="18" fill="none" stroke="currentColor"/><text x="432" y="147" text-anchor="middle" font-size="10.5">question</text>
<line x1="512" y1="102" x2="550" y2="102" stroke="currentColor" marker-end="url(#a11)"/>
<rect x="552" y="80" width="96" height="44" rx="3" fill="none" stroke="currentColor"/><text x="600" y="98" text-anchor="middle" font-weight="700">model</text><text x="600" y="114" text-anchor="middle" font-size="10.5" opacity=".75">answer + cites</text>
<text x="330" y="212" text-anchor="middle" font-size="11" font-style="italic" opacity=".75">the weights never change — new knowledge arrives through the prompt</text>
</g></svg>
