<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="The agent loop: a goal enters; the model thinks and chooses an action; the action is a tool call executed in an environment such as a shell, browser or API; the observation returns to the model's context; the loop repeats until the model decides the goal is done and reports." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Tool use and agency</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<rect x="14" y="108" width="78" height="40" rx="3" fill="none" stroke="currentColor"/><text x="53" y="133" text-anchor="middle" font-weight="700">goal</text>
<line x1="92" y1="128" x2="140" y2="128" stroke="currentColor" marker-end="url(#a12)"/>
<rect x="142" y="94" width="150" height="68" rx="4" class="af" opacity=".18"/><rect x="142" y="94" width="150" height="68" rx="4" fill="none" class="as"/>
<text x="217" y="116" text-anchor="middle" font-weight="700">model</text>
<text x="217" y="132" text-anchor="middle" font-size="11">think → choose action</text>
<text x="217" y="148" text-anchor="middle" font-size="11" opacity=".75">context = goal + all history</text>
<path d="M292 112 C 340 112, 360 60, 400 60" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a12)"/>
<text x="346" y="72" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5">run_tests()</text>
<rect x="402" y="30" width="180" height="60" rx="4" fill="none" stroke="currentColor"/>
<text x="492" y="52" text-anchor="middle" font-weight="700">environment</text>
<text x="492" y="68" text-anchor="middle" font-size="11" opacity=".8">shell · files · browser · APIs</text>
<path d="M492 90 C 492 150, 330 140, 292 144" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a12)"/>
<text x="404" y="150" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5">"3 passed, 1 failed:…"</text>
<text x="404" y="164" text-anchor="middle" font-size="10.5" opacity=".75">observation appended to context</text>
<path d="M217 162 C 217 200, 150 210, 100 210 C 60 210, 60 148, 92 140" fill="none" class="as" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a12)"/>
<text x="150" y="226" text-anchor="middle" class="af" font-size="11.5" font-weight="700">repeat until done</text>
<text x="150" y="241" text-anchor="middle" font-size="10.5" opacity=".75">10 – 1,000+ steps</text>
<line x1="292" y1="128" x2="400" y2="128" stroke="currentColor" opacity=".5" stroke-dasharray="2 3"/>
<line x1="400" y1="128" x2="540" y2="128" stroke="currentColor" opacity=".5" stroke-dasharray="2 3" marker-end="url(#a12)"/>
<rect x="542" y="108" width="84" height="40" rx="3" fill="none" stroke="currentColor"/><text x="584" y="127" text-anchor="middle" font-weight="700">report</text><text x="584" y="141" text-anchor="middle" font-size="10.5" opacity=".75">when done</text>
<text x="330" y="218" font-size="11" font-style="italic" opacity=".75">the feedback edge is what lets the model catch and fix its own mistakes</text>
</g></svg>
