<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-label="A mixture-of-experts layer: a token's representation enters a router, which selects 2 of 8 expert feed-forward networks; only those two are computed and their outputs are combined. Six experts remain idle for this token." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Hardware–algorithm co-design</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<text x="12" y="22" font-weight="700" letter-spacing="1.2">MIXTURE OF EXPERTS: ONE TOKEN'S PATH THROUGH A LAYER</text>
<rect x="12" y="120" width="90" height="36" rx="3" fill="none" stroke="currentColor"/><text x="57" y="143" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5">"insulin"</text>
<line x1="102" y1="138" x2="140" y2="138" stroke="currentColor" marker-end="url(#a8)"/>
<rect x="142" y="112" width="90" height="52" rx="3" fill="none" stroke="currentColor"/><text x="187" y="134" text-anchor="middle" font-weight="700">router</text><text x="187" y="150" text-anchor="middle" font-size="10.5" opacity=".75">pick top-2 of 8</text>
<g>
<rect x="320" y="40" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity=".35"/><text x="380" y="55" text-anchor="middle" opacity=".45">expert 1 · code</text>
<rect x="320" y="68" width="120" height="22" rx="3" class="af" opacity=".22"/><rect x="320" y="68" width="120" height="22" rx="3" fill="none" class="as" stroke-width="1.5"/><text x="380" y="83" text-anchor="middle" font-weight="700">expert 2 · biomedical</text>
<rect x="320" y="96" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity=".35"/><text x="380" y="111" text-anchor="middle" opacity=".45">expert 3 · legal</text>
<rect x="320" y="124" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity=".35"/><text x="380" y="139" text-anchor="middle" opacity=".45">expert 4 · dialogue</text>
<rect x="320" y="152" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity=".35"/><text x="380" y="167" text-anchor="middle" opacity=".45">expert 5 · math</text>
<rect x="320" y="180" width="120" height="22" rx="3" class="af" opacity=".22"/><rect x="320" y="180" width="120" height="22" rx="3" fill="none" class="as" stroke-width="1.5"/><text x="380" y="195" text-anchor="middle" font-weight="700">expert 6 · chemistry</text>
<rect x="320" y="208" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity=".35"/><text x="380" y="223" text-anchor="middle" opacity=".45">expert 7 · multilingual</text>
<rect x="320" y="236" width="120" height="22" rx="3" fill="none" stroke="currentColor" opacity=".35"/><text x="380" y="251" text-anchor="middle" opacity=".45">expert 8 · general</text>
</g>
<path d="M232 130 C 270 110, 290 79, 318 79" fill="none" class="as" stroke-width="2.5" marker-end="url(#a8)"/>
<path d="M232 146 C 270 160, 290 191, 318 191" fill="none" class="as" stroke-width="2" marker-end="url(#a8)"/>
<text x="262" y="100" class="af" font-weight="700" font-size="11.5">0.7</text>
<text x="262" y="184" class="af" font-weight="700" font-size="11.5">0.3</text>
<path d="M440 79 C 480 79, 490 128, 518 130" fill="none" class="as" stroke-width="2.5" marker-end="url(#a8)"/>
<path d="M440 191 C 480 191, 490 146, 518 144" fill="none" class="as" stroke-width="2" marker-end="url(#a8)"/>
<rect x="520" y="118" width="80" height="40" rx="3" fill="none" stroke="currentColor"/><text x="560" y="134" text-anchor="middle" font-weight="700">weighted</text><text x="560" y="149" text-anchor="middle" font-weight="700">sum</text>
