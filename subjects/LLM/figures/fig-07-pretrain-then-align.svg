<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img" aria-label="Three-stage pipeline: pretraining on trillions of tokens of internet text produces a base model; supervised fine-tuning on tens of thousands of demonstrations produces an instruction-following model; reinforcement learning from human preferences, via a reward model, produces the aligned assistant." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Pretrain, then align</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<rect x="12" y="50" width="176" height="72" rx="4" fill="none" stroke="currentColor"/>
<text x="100" y="72" text-anchor="middle" font-weight="700">1 · Pretraining</text>
<text x="100" y="90" text-anchor="middle" font-size="11.5">next-token prediction</text>
<text x="100" y="106" text-anchor="middle" font-size="11.5" opacity=".75">~10¹³ tokens · months · $10⁸</text>
<line x1="188" y1="86" x2="230" y2="86" stroke="currentColor" marker-end="url(#a7)"/>
<text x="209" y="76" text-anchor="middle" font-size="10.5" opacity=".7">base</text>
<rect x="232" y="50" width="176" height="72" rx="4" fill="none" stroke="currentColor"/>
<text x="320" y="72" text-anchor="middle" font-weight="700">2 · Supervised fine-tune</text>
<text x="320" y="90" text-anchor="middle" font-size="11.5">imitate ideal answers</text>
<text x="320" y="106" text-anchor="middle" font-size="11.5" opacity=".75">~10⁴–10⁵ examples · days</text>
<line x1="408" y1="86" x2="450" y2="86" stroke="currentColor" marker-end="url(#a7)"/>
<text x="429" y="76" text-anchor="middle" font-size="10.5" opacity=".7">SFT</text>
<rect x="452" y="50" width="216" height="72" rx="4" class="af" opacity=".18"/><rect x="452" y="50" width="216" height="72" rx="4" fill="none" class="as"/>
<text x="560" y="72" text-anchor="middle" font-weight="700">3 · RL from human feedback</text>
<text x="560" y="90" text-anchor="middle" font-size="11.5">maximize reward-model score</text>
<text x="560" y="106" text-anchor="middle" font-size="11.5" opacity=".75">~10⁵ comparisons · days</text>
<rect x="470" y="160" width="180" height="46" rx="4" fill="none" stroke="currentColor" stroke-dasharray="4 3"/>
<text x="560" y="179" text-anchor="middle" font-weight="700">reward model</text>
<text x="560" y="195" text-anchor="middle" font-size="11" opacity=".75">trained on “A is better than B”</text>
<line x1="520" y1="160" x2="520" y2="124" stroke="currentColor" marker-end="url(#a7)"/><text x="512" y="146" text-anchor="end" font-size="10.5">score</text>
<line x1="600" y1="122" x2="600" y2="158" stroke="currentColor" marker-end="url(#a7)"/><text x="608" y="146" font-size="10.5">answers</text>
<text x="100" y="150" text-anchor="middle" font-style="italic" opacity=".75">99% of compute</text>
<text x="100" y="166" text-anchor="middle" font-style="italic" opacity=".75">capability comes from here</text>
<text x="320" y="150" text-anchor="middle" font-style="italic" opacity=".75">~1% of compute</text>
<text x="320" y="166" text-anchor="middle" font-style="italic" opacity=".75">usability comes from here</text>
</g></svg>
