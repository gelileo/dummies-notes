<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Left: the sentence 'The trophy didn't fit in the suitcase because it was too big', with attention arrows from 'it' back to earlier tokens, thickest to 'trophy'. Right: a Transformer block showing attention and feed-forward sublayers with residual connections, stacked N times." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Attention and the Transformer</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<text x="12" y="22" font-weight="700" letter-spacing="1.2">ATTENTION: WHAT DOES “IT” REFER TO?</text>
<g font-family="JetBrains Mono, monospace" font-size="11.5">
<rect x="12" y="150" width="32" height="26" rx="3" fill="none" stroke="currentColor"/><text x="28" y="168" text-anchor="middle">The</text>
<rect x="48" y="150" width="56" height="26" rx="3" class="af" opacity=".25"/><rect x="48" y="150" width="56" height="26" rx="3" fill="none" class="as" stroke-width="1.5"/><text x="76" y="168" text-anchor="middle">trophy</text>
<rect x="108" y="150" width="50" height="26" rx="3" fill="none" stroke="currentColor"/><text x="133" y="168" text-anchor="middle">didn't</text>
<rect x="162" y="150" width="30" height="26" rx="3" fill="none" stroke="currentColor"/><text x="177" y="168" text-anchor="middle">fit</text>
<rect x="196" y="150" width="24" height="26" rx="3" fill="none" stroke="currentColor"/><text x="208" y="168" text-anchor="middle">in</text>
<rect x="224" y="150" width="30" height="26" rx="3" fill="none" stroke="currentColor"/><text x="239" y="168" text-anchor="middle">the</text>
<rect x="258" y="150" width="64" height="26" rx="3" fill="none" stroke="currentColor"/><text x="290" y="168" text-anchor="middle">suitcase</text>
<rect x="326" y="150" width="58" height="26" rx="3" fill="none" stroke="currentColor"/><text x="355" y="168" text-anchor="middle">because</text>
<rect x="388" y="150" width="24" height="26" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><text x="400" y="168" text-anchor="middle" font-weight="700">it</text>
</g>
<path d="M400 150 C 360 90, 120 90, 76 150" fill="none" class="as" stroke-width="3.5" marker-end="url(#a4)"/>
<path d="M400 150 C 380 110, 300 110, 290 150" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55" marker-end="url(#a4)"/>
<path d="M400 150 C 395 128, 185 118, 177 150" fill="none" stroke="currentColor" stroke-width="1" opacity=".35" marker-end="url(#a4)"/>
<text x="200" y="96" text-anchor="middle" class="af" font-weight="700">0.62</text>
<text x="330" y="118" text-anchor="middle" opacity=".7">0.21</text>
<text x="255" y="134" text-anchor="middle" opacity=".55">0.05</text>
<text x="12" y="204" font-style="italic" opacity=".75">attention weights: how much “it” borrows from each earlier token</text>
<text x="12" y="222" font-style="italic" opacity=".75">(swap “big” for “small” and the arrow to “suitcase” becomes the strong one)</text>

<text x="470" y="22" font-weight="700" letter-spacing="1.2">ONE TRANSFORMER BLOCK</text>
<rect x="470" y="34" width="196" height="232" rx="4" fill="none" stroke="currentColor" opacity=".5" stroke-dasharray="4 3"/>
<text x="568" y="52" text-anchor="middle" opacity=".7">× N (30–100+)</text>
<line x1="568" y1="266" x2="568" y2="240" stroke="currentColor" marker-end="url(#a4)"/>
<rect x="504" y="200" width="128" height="36" rx="3" class="af" opacity=".18"/><rect x="504" y="200" width="128" height="36" rx="3" fill="none" class="as"/><text x="568" y="216" text-anchor="middle" font-weight="700">attention</text><text x="568" y="229" text-anchor="middle" font-size="10.5">tokens exchange info</text>
<line x1="568" y1="200" x2="568" y2="176" stroke="currentColor" marker-end="url(#a4)"/>
<text x="581" y="184" font-size="10.5" opacity=".7">+ norm</text>
<rect x="504" y="132" width="128" height="36" rx="3" fill="none" stroke="currentColor"/><text x="568" y="148" text-anchor="middle" font-weight="700">feed-forward</text><text x="568" y="161" text-anchor="middle" font-size="10.5">each token alone</text>
<line x1="568" y1="132" x2="568" y2="106" stroke="currentColor" marker-end="url(#a4)"/>
<text x="581" y="116" font-size="10.5" opacity=".7">+ norm</text>
<text x="568" y="92" text-anchor="middle" opacity=".7">to next block</text>
<path d="M490 266 L490 218 L504 218" fill="none" stroke="currentColor" opacity=".5"/><path d="M490 218 L490 150 L504 150" fill="none" stroke="currentColor" opacity=".5"/>
<text x="478" y="245" font-size="10" opacity=".7" transform="rotate(-90 478 245)">residual</text>
</g></svg>
