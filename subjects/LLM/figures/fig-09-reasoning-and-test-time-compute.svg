<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Two axes of scaling. The horizontal axis is training compute; the vertical axis is inference-time thinking tokens. Accuracy contours rise toward the top-right. Arrows show that moving up (more thinking) can match moving right (a bigger model)." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Reasoning and test-time compute</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<line x1="80" y1="220" x2="600" y2="220" stroke="currentColor" opacity=".5" marker-end="url(#a9)"/>
<line x1="80" y1="220" x2="80" y2="24" stroke="currentColor" opacity=".5" marker-end="url(#a9)"/>
<text x="600" y="242" text-anchor="end" opacity=".75">training compute (model size × data) →</text>
<text x="30" y="122" transform="rotate(-90 30 122)" text-anchor="middle" opacity=".75">thinking tokens at inference →</text>
<g fill="none" class="as" opacity=".55">
<path d="M80 150 C 200 140, 260 90, 300 24"/>
<path d="M80 200 C 260 190, 380 120, 440 24"/>
<path d="M200 220 C 380 200, 500 130, 580 24"/>
</g>
<g class="af" font-size="11" font-weight="700">
<text x="106" y="140">90%</text><text x="122" y="184">70%</text><text x="260" y="208">50%</text>
</g>
<text x="92" y="42" font-size="11" font-style="italic" opacity=".7">contours: accuracy on a hard math benchmark</text>
<circle cx="220" cy="205" r="6" fill="currentColor"/><text x="208" y="209" text-anchor="end" font-size="11.5" font-weight="700">GPT-4 class, instant answer</text>
<line x1="220" y1="205" x2="470" y2="205" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a9)"/>
<circle cx="480" cy="205" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="350" y="192" text-anchor="middle" font-size="11" opacity=".8">old route: a 10× bigger model</text>
<line x1="220" y1="205" x2="220" y2="70" class="as" stroke-width="2.5" marker-end="url(#a9)"/>
<circle cx="220" cy="60" r="6" class="af"/>
<text x="232" y="64" font-size="11.5" font-weight="700" class="af">same model, think for 10,000 tokens</text>
<text x="232" y="80" font-size="11" class="af">reaches the same contour</text>
</g></svg>
