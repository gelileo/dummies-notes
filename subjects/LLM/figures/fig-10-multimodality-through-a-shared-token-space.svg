<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-label="An image is cut into a 4-by-4 grid of patches which become 16 tokens; text becomes tokens too; both are concatenated into one sequence that enters the same Transformer, which outputs text describing the image." width="100%">
<style>svg{color:#1A212C}.bg{fill:#F6F7F5}.af{fill:#0B7A83}.as{stroke:#0B7A83}@media (prefers-color-scheme:dark){svg{color:#E3E7EC}.bg{fill:#12171E}.af{fill:#38B6BE}.as{stroke:#38B6BE}}</style>
<title>Multimodality through a shared token space</title>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<defs><marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="currentColor"/></marker></defs>
<g font-family="Bricolage Grotesque, sans-serif" font-size="12" fill="currentColor">
<g stroke="currentColor" class="af">
<rect x="16" y="40" width="22" height="22" opacity=".15"/><rect x="40" y="40" width="22" height="22" opacity=".25"/><rect x="64" y="40" width="22" height="22" opacity=".35"/><rect x="88" y="40" width="22" height="22" opacity=".2"/>
<rect x="16" y="64" width="22" height="22" opacity=".3"/><rect x="40" y="64" width="22" height="22" opacity=".55"/><rect x="64" y="64" width="22" height="22" opacity=".6"/><rect x="88" y="64" width="22" height="22" opacity=".25"/>
<rect x="16" y="88" width="22" height="22" opacity=".25"/><rect x="40" y="88" width="22" height="22" opacity=".5"/><rect x="64" y="88" width="22" height="22" opacity=".5"/><rect x="88" y="88" width="22" height="22" opacity=".3"/>
<rect x="16" y="112" width="22" height="22" opacity=".15"/><rect x="40" y="112" width="22" height="22" opacity=".2"/><rect x="64" y="112" width="22" height="22" opacity=".2"/><rect x="88" y="112" width="22" height="22" opacity=".15"/>
</g>
<text x="63" y="30" text-anchor="middle" opacity=".75">image → 16 patches</text>
<text x="16" y="152" font-size="11" opacity=".7">each patch → one vector</text>
<line x1="112" y1="86" x2="150" y2="86" stroke="currentColor" marker-end="url(#a10)"/>
<g font-family="JetBrains Mono, monospace" font-size="10.5">
<rect x="154" y="74" width="12" height="24" class="af" opacity=".5"/><rect x="168" y="74" width="12" height="24" class="af" opacity=".5"/><rect x="182" y="74" width="12" height="24" class="af" opacity=".5"/><rect x="196" y="74" width="12" height="24" class="af" opacity=".5"/>
<text x="212" y="91" opacity=".7">…</text>
<rect x="226" y="74" width="12" height="24" class="af" opacity=".5"/>
<rect x="244" y="74" width="46" height="24" fill="none" stroke="currentColor"/><text x="267" y="90" text-anchor="middle">What</text>
<rect x="294" y="74" width="30" height="24" fill="none" stroke="currentColor"/><text x="309" y="90" text-anchor="middle">is</text>
<rect x="328" y="74" width="40" height="24" fill="none" stroke="currentColor"/><text x="348" y="90" text-anchor="middle">this</text>
<rect x="372" y="74" width="20" height="24" fill="none" stroke="currentColor"/><text x="382" y="90" text-anchor="middle">?</text>
</g>
<text x="273" y="62" text-anchor="middle" opacity=".75">one sequence: image tokens then text tokens</text>
<line x1="273" y1="104" x2="273" y2="128" stroke="currentColor" marker-end="url(#a10)"/>
<rect x="163" y="130" width="220" height="40" rx="3" fill="none" stroke="currentColor"/><text x="273" y="155" text-anchor="middle" font-weight="700">the same Transformer</text>
<line x1="383" y1="150" x2="420" y2="150" stroke="currentColor" marker-end="url(#a10)"/>
<text x="428" y="154" font-family="JetBrains Mono, monospace" font-size="11.5">“A dental X-ray showing…”</text>
<text x="500" y="40" text-anchor="middle" font-size="11" font-style="italic" opacity=".75">audio frames and video patches</text>
<text x="500" y="56" text-anchor="middle" font-size="11" font-style="italic" opacity=".75">enter the sequence the same way</text>
</g></svg>
